<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Golden Banana Gradient -->
    <linearGradient id="bananaGold" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Deep Emerald Green Gradient for Financial Growth -->
    <linearGradient id="growthGreen" x1="80" y1="40" x2="220" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="bananaGlow" cx="128" cy="128" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="128" cy="128" r="110" fill="url(#bananaGlow)" />

  <!-- Sleek Curved Banana Silhouette forming an outer crescent & chart frame -->
  <g filter="url(#dropShadow)">
    <path d="M 64 48 C 50 68 44 94 44 122 C 44 172 82 212 136 216 C 176 218 206 200 220 176 C 204 186 178 190 148 186 C 104 180 72 146 72 108 C 72 84 80 64 94 48 C 82 46 72 46 64 48 Z" fill="url(#bananaGold)" />

    <!-- Banana Stem Tip -->
    <path d="M 64 48 C 66 40 72 34 78 30 C 82 34 82 42 78 48 Z" fill="#10B981" />
    
    <!-- Banana Base Tip -->
    <circle cx="218" cy="176" r="4.5" fill="#78350F" />
  </g>

  <!-- Financial Candlesticks integrated in background of the arch -->
  <g opacity="0.85">
    <!-- Candle 1 -->
    <line x1="98" y1="130" x2="98" y2="175" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
    <rect x="92" y="142" width="12" height="22" rx="3" fill="#10B981" />

    <!-- Candle 2 -->
    <line x1="126" y1="110" x2="126" y2="165" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
    <rect x="120" y="120" width="12" height="32" rx="3" fill="#10B981" />

    <!-- Candle 3 (Peak) -->
    <line x1="154" y1="78" x2="154" y2="148" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
    <rect x="148" y="90" width="12" height="38" rx="3" fill="#10B981" />
  </g>

  <!-- Central Rupee Symbol (₹) with Modern Rounded Fintech Geometry -->
  <g filter="url(#dropShadow)">
    <!-- Top Horizontal Bar -->
    <rect x="100" y="68" width="58" height="7.5" rx="3.75" fill="#1E293B" />
    <!-- Second Horizontal Bar -->
    <rect x="100" y="85" width="54" height="7.5" rx="3.75" fill="#1E293B" />
    <!-- Vertical Spine and Curve -->
    <path d="M 112 68 V 116 C 122 116 142 114 142 98 C 142 82 124 82 112 82" stroke="#1E293B" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Diagonal Leg / Growth Ray -->
    <path d="M 124 112 L 158 156" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Stock Trendline arrow bursting upward -->
  <path d="M 88 160 Q 130 140 165 96 L 198 64" stroke="url(#growthGreen)" stroke-width="5" stroke-linecap="round" />
  <polygon points="198,54 204,74 186,68" fill="#059669" />
</svg>