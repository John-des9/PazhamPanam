      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main banana body -->
  <path d="M30 20C35 15 45 12 55 15C65 18 75 25 80 35C85 45 83 55 78 65C73 75 65 82 55 85C45 88 35 85 28 78C21 71 18 61 20 51C22 41 25 31 30 20Z" fill="url(#bananaGradient)"/>
  
